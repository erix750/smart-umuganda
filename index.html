<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#f4f6f0" />
	<meta name="description" content="Smart Umuganda connects citizens, community leaders and national administrators to organize community work." />
	<title>Smart Umuganda | Community work, together</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="system.css" />
	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="database.js" defer></script>
	<script src="system.js" defer></script>
</head>
<body>
	<div class="system-root">
		<aside class="system-sidebar">
			<a class="system-brand" href="#dashboard"><span class="system-brand-mark"><i data-lucide="sprout"></i></span><span>smart <b>umuganda</b></span></a>
			<div class="system-role-label" id="role-label">CITIZEN PORTAL</div>
			<nav class="system-nav" aria-label="Main navigation">
				<button class="system-nav-link active" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span data-i18n="navDashboard">Home / Dashboard</span></button>
				<button class="system-nav-link" data-view="registration"><i data-lucide="user-round-plus"></i><span data-i18n="navRegister">Citizen registration</span></button>
				<button class="system-nav-link" data-view="activities"><i data-lucide="calendar-days"></i><span data-i18n="navActivities">Umuganda activities</span></button>
				<button class="system-nav-link" data-view="participation"><i data-lucide="clipboard-check"></i><span data-i18n="navParticipation">Participation & check-in</span></button>
				<button class="system-nav-link" data-view="tasks"><i data-lucide="list-checks"></i><span data-i18n="navTasks">Community tasks</span></button>
				<button class="system-nav-link" data-view="reports"><i data-lucide="file-chart-column-increasing"></i><span data-i18n="navReports">Reports & evidence</span></button>
				<button class="system-nav-link leader-nav" data-view="leaders"><i data-lucide="users-round"></i><span data-i18n="navLeaders">Leader dashboard</span></button>
				<button class="system-nav-link head-nav" data-view="national"><i data-lucide="landmark"></i><span data-i18n="navNational">Head admin / Minister</span></button>
			</nav>
			<div class="system-sidebar-bottom">
				<div class="system-language"><i data-lucide="languages"></i><span data-i18n="language">Language</span><select id="language-select" aria-label="Language"><option value="en">English</option><option value="rw">Kinyarwanda</option></select></div>
				<div class="system-user"><button id="profile-photo-button" class="profile-photo-button" type="button" title="Add profile picture" aria-label="Add profile picture" hidden><span class="system-avatar" id="system-avatar"><span id="avatar-initials">UM</span><img id="profile-picture" alt="" hidden /></span><i data-lucide="camera"></i></button><input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden /><span class="system-user-copy"><strong id="user-name">Umutoni Marie</strong><small id="user-role">Citizen</small></span><button id="logout-button" title="Sign out" aria-label="Sign out" hidden><i data-lucide="log-out"></i></button></div>
			</div>
		</aside>
		<main class="system-main">
			<header class="system-topbar"><div class="system-breadcrumb"><span>Rwanda</span><i data-lucide="chevron-right"></i><strong id="current-section">Home / Dashboard</strong></div><div class="system-top-actions"><label class="system-text-size"><i data-lucide="type"></i><select id="text-size-select" aria-label="Text size"><option value="1">Normal text</option><option value="1.15">Large text</option><option value="1.3">Extra large text</option></select></label><span class="system-location"><i data-lucide="map-pin"></i>Kigali, Rwanda</span><span class="system-live"><i></i> System active</span><button class="role-access" id="open-role-access"><i data-lucide="shield-check"></i><span data-i18n="switchRole">Leader access</span></button></div></header>
			<div id="view-container" class="system-content" aria-live="polite"></div>
		</main>
	</div>
	<div id="system-toast" class="system-toast" role="status" aria-live="polite"></div>
	<dialog id="role-dialog" class="system-dialog"><form id="role-form"><div class="dialog-title-row"><div><p class="system-kicker">LEADER ACCOUNT</p><h2>Sign in securely</h2></div><button class="round-close" type="button" data-close-dialog aria-label="Close"><i data-lucide="x"></i></button></div><p class="dialog-note">Use the email and password provided by your administrator.</p><label class="field-label">Email address<input name="username" type="email" autocomplete="username" required maxlength="254" /></label><label class="field-label">Password<input name="password" type="password" autocomplete="current-password" required maxlength="256" /></label><p class="login-error" id="login-error" role="alert" hidden></p><div class="dialog-actions"><button class="system-button secondary" type="button" data-close-dialog>Cancel</button><button class="system-button primary" type="submit">Sign in <i data-lucide="arrow-right"></i></button></div></form></dialog>
</body>
</html>
